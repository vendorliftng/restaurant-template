<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFFFFF">
    <title>Add dishes | VendorLift</title>
    <link rel="stylesheet" href="forms.css">
    <link rel="stylesheet" href="menu.css">
    <script src="menu.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html" aria-label="VendorLift home">
            <span class="brand-mark" aria-hidden="true">V</span>
            <span>VendorLift</span>
        </a>
    </header>

    <main class="form-layout menu-layout">
        <section class="form-card" aria-labelledby="form-title">
            <a class="back-link" href="forms.html"><span aria-hidden="true">←</span> Back to restaurant details</a>
            <div class="card-heading">
                <p class="eyebrow">Restaurant profile · Step 2 of 2 you are almost done</p>
                <h1 id="form-title">Add your dishes</h1>
                <p>Add a photo, name, price, short description, and ingredients for each dish you serve.</p>
            </div>

            <form id="dish-form" action="feed.html" method="GET" enctype="multipart/form-data">
                <div id="dish-list" class="dish-list" aria-live="polite"></div>
                <button id="add-dish" class="secondary-button" type="button">+ Add another dish</button>
                <div class="form-actions">
                    <a class="back-button" href="forms.html">Back to edit restaurant details</a>
                    <button class="submit-button" type="submit">Submit dishes</button>
                </div>
            </form>
        </section>
    </main>

    <template id="dish-template">
        <fieldset class="dish-card">
            <legend class="dish-legend"></legend>
            <button class="remove-dish" type="button">Remove dish</button>
            <div class="dish-fields">
                <div class="field field-full">
                    <label data-label="photo">Dish photo</label>
                    <input data-field="photo" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
                    <span class="field-hint">Choose a JPG, PNG, GIF, or WebP image smaller than 1 MB.</span>
                    <img class="image-preview" alt="" hidden>
                </div>
                <div class="field">
                    <label data-label="name">Dish name</label>
                    <input data-field="name" type="text" placeholder="e.g. Sunday roast" required>
                </div>
                <div class="field">
                    <label data-label="description">Brief description</label>
                    <input data-field="description" type="text" placeholder="A short introduction to the dish">
                </div>
                <div class="field">
                    <label data-label="price">Price (₦)</label>
                    <input data-field="price" type="number" min="0" step="50" placeholder="e.g. 2500" required>
                </div>
                <div class="field field-full">
                    <label data-label="ingredients">Ingredients</label>
                    <textarea data-field="ingredients" rows="3" placeholder="List the main ingredients, separated by commas"></textarea>
                </div>
            </div>
        </fieldset>
    </template>
</body>
</html>
