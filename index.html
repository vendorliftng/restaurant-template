<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFFFFF">
    <title>Welcome | VendorLift</title>
    <link rel="stylesheet" href="signin.css">
    <link rel="stylesheet" href="role.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html" aria-label="VendorLift home">
            <span class="brand-mark" aria-hidden="true">V</span>
            <span>VendorLift</span>
        </a>
    </header>

    <main class="role-layout">
        <section class="role-panel" aria-labelledby="role-title">
            <p class="eyebrow">Welcome to VendorLift</p>
            <h1 id="role-title">How will you use VendorLift?</h1>
            <p class="role-intro">Choose the account that best describes you.</p>
 
            <div class="role-options">
                <a class="role-card" href="signin.html">
                    <span class="role-icon customer-icon" aria-hidden="true">C</span>
                    <span class="role-copy">
                        <strong>I'm a customer</strong>
                        <span>Discover restaurants and find your next favorite meal.</span>
                    </span>
                    <span class="role-arrow" aria-hidden="true">→</span>
                </a>

                <a class="role-card" href="restaurant-signin.html">
                    <span class="role-icon restaurant-icon" aria-hidden="true">R</span>
                    <span class="role-copy">
                        <strong>I'm a restaurant</strong>
                        <span>Manage your restaurant and share your dishes with customers.</span>
                    </span>
                    <span class="role-arrow" aria-hidden="true">→</span>
                </a>
            </div>
        </section>
    </main>

    <footer class="site-footer">© <span data-current-year></span> VendorLift</footer>
    <script src="auth.js?v=auth-gate" defer></script>
</body>
</html>
